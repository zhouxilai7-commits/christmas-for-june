
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merry Christmas · June Yu</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    overflow: hidden;
    background: #040719;
    color: white;
    font-family: Georgia, "Microsoft YaHei", serif;
}

#scene {
    position: fixed;
    inset: 0;
}

#scene canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
    cursor: grab;
}

#scene canvas.dragging {
    cursor: grabbing;
}

.greeting {
    position: absolute;
    left: 5%;
    top: 27%;
    z-index: 2;
    pointer-events: none;
    text-shadow: 0 0 14px rgba(180,150,255,.25);
}

.greeting h1 {
    margin: 0 0 12px;
    font-size: clamp(34px,4.2vw,66px);
    font-weight: normal;
}

.greeting p {
    margin: 0;
    font-size: clamp(18px,2vw,28px);
    line-height: 1.5;
}

.decor-line {
    width: 170px;
    height: 2px;
    margin: 10px 0 14px;
    border-radius: 999px;
    background: linear-gradient(
        90deg,
        transparent,
        #f4d4aa,
        #f6b5d8,
        transparent
    );
    box-shadow: 0 0 12px rgba(246,181,216,.35);
}

.sparkle {
    position: absolute;
    color: #ffe8f9;
    text-shadow: 0 0 14px #e7b6ff;
    animation: twinkle 3.2s ease-in-out infinite;
}

.sparkle.s1 {
    top: -12px;
    left: 20px;
    font-size: 18px;
}

.sparkle.s2 {
    top: 26px;
    right: -10px;
    font-size: 13px;
    animation-delay: .8s;
}

.sparkle.s3 {
    bottom: -4px;
    left: 145px;
    font-size: 16px;
    animation-delay: 1.5s;
}

@keyframes twinkle {
    0%,100% {
        opacity: .35;
        transform: scale(.92);
    }
    50% {
        opacity: 1;
        transform: scale(1.08);
    }
}

.panel {
    position: absolute;
    left: 4%;
    bottom: 4%;
    z-index: 3;
    width: 345px;
    max-width: 90vw;
    padding: 16px;
    border-radius: 15px;
    background: rgba(9,13,37,.83);
    border: 1px solid rgba(170,160,235,.25);
    backdrop-filter: blur(12px);
    font-family: Arial, "Microsoft YaHei", sans-serif;
}

.panel-title {
    font-size: 14px;
    margin-bottom: 16px;
    color: #eee5ff;
}

.setting {
    margin-bottom: 15px;
}

.setting label {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: #c9cbed;
    margin-bottom: 7px;
}

.setting input[type="range"] {
    width: 100%;
    accent-color: #bc9afa;
    cursor: pointer;
}

.buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
}

button {
    padding: 9px 11px;
    border-radius: 8px;
    border: 1px solid #57557d;
    background: #252649;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #494479;
}

.help {
    position: absolute;
    right: 25px;
    bottom: 20px;
    color: #aab3d9;
    font-size: 12px;
    pointer-events: none;
}

@media(max-width:700px) {
    .greeting {
        top: 8%;
    }
    .panel {
        left: 3%;
        bottom: 2%;
        padding: 12px;
    }
    .help {
        display: none;
    }
}
</style>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js"
    }
}
</script>
</head>

<body>

<div id="scene"></div>

<div class="greeting">
    <div class="sparkle s1">✦</div>
    <div class="sparkle s2">✦</div>
    <div class="sparkle s3">✦</div>

    <h1>Merry Christmas</h1>
    <div class="decor-line"></div>
    <p>To June Yu ～ 姐姐天天开心 ✨</p>
</div>

<div class="panel">
    <div class="panel-title">🎄 圣诞树控制台</div>

    <div class="setting">
        <label>
            <span>圣诞树大小</span>
            <span id="scaleValue">1.39</span>
        </label>
        <input id="scaleSlider" type="range"
               min="0.8" max="1.8"
               step="0.01" value="1.39">
    </div>

    <div class="setting">
        <label>
            <span>粒子亮度</span>
            <span id="brightValue">1.50</span>
        </label>
        <input id="brightSlider" type="range"
               min="0.2" max="2.0"
               step="0.01" value="1.50">
    </div>

    <div class="setting">
        <label>
            <span>丝带流动速度</span>
            <span id="speedValue">0.055</span>
        </label>
        <input id="speedSlider" type="range"
               min="0" max="0.15"
               step="0.005" value="0.055">
    </div>

    <div class="buttons">
        <button id="pause">暂停动画</button>
        <button id="scatter">粒子散开</button>
        <button id="reset">重置视角</button>
        <button id="shot">保存图片</button>
    </div>
</div>

<div class="help">
    左键拖动旋转 · 滚轮缩放 · 右键平移
</div>

<script type="module">

import * as THREE from "three";

// ========================================
// 1. 参数
// ========================================

const TAU = Math.PI * 2;
const BASE_Y = -5.45;

const CONFIG = {
    branchLayers: 18,
    needlesPerBranch: 120,
    innerFillPoints: 6500,

    ribbonPoints: 18000,
    ribbonTurns: 5.4,
    ribbonFlowSpeed: 0.055,

    groundPoints: 2300,
    starPoints: 2600,
    tinySnowPoints: 1800,

    heartPoints: 750,
    ornamentPoints: 320,
    snowPoints: 220,

    treeHeight: 11.4,
    treeRadius: 3.85,
    treeScale: 1.39,

    rotationSpeed: 0.085,
    brightness: 1.50,

    // 新增流星参数
    meteorCount: 5,
    meteorIntervalMin: 0.7,
    meteorIntervalMax: 1.8,
    meteorDurationMin: 2.5,
    meteorDurationMax: 3.8
};

let elapsed = 0;
let paused = false;

let formTarget = 1;
let formCurrent = 1;

function random(min,max) {
    return min + Math.random() * (max-min);
}


// ========================================
// 2. 场景与相机
// ========================================

const scene = new THREE.Scene();
scene.background = new THREE.Color("#040719");

const camera = new THREE.PerspectiveCamera(
    50,
    innerWidth / innerHeight,
    0.1,
    200
);

const renderer = new THREE.WebGLRenderer({
    antialias: true,
    preserveDrawingBuffer: true
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(
    Math.min(devicePixelRatio,1.5)
);

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

const canvas = renderer.domElement;
document.getElementById("scene").appendChild(canvas);


// ========================================
// 3. 相机交互
// ========================================

const orbit = {
    theta: 0,
    phi: 1.38,
    radius: 23.5,

    targetTheta: 0,
    targetPhi: 1.38,
    targetRadius: 23.5,

    target: new THREE.Vector3(1.7,0.45,0)
};

let dragging = false;
let activePointer = null;
let dragButton = 0;
let lastX = 0;
let lastY = 0;

function updateCamera(dt=0.016) {
    const k = 1-Math.exp(-12*dt);

    orbit.theta = THREE.MathUtils.lerp(
        orbit.theta,orbit.targetTheta,k
    );
    orbit.phi = THREE.MathUtils.lerp(
        orbit.phi,orbit.targetPhi,k
    );
    orbit.radius = THREE.MathUtils.lerp(
        orbit.radius,orbit.targetRadius,k
    );

    const horizontal =
        orbit.radius*Math.sin(orbit.phi);

    camera.position.set(
        orbit.target.x +
            horizontal*Math.sin(orbit.theta),

        orbit.target.y +
            orbit.radius*Math.cos(orbit.phi),

        orbit.target.z +
            horizontal*Math.cos(orbit.theta)
    );

    camera.lookAt(orbit.target);
}

updateCamera(1);

canvas.addEventListener("pointerdown",e=>{
    if(e.button!==0 && e.button!==2) return;

    dragging=true;
    activePointer=e.pointerId;
    dragButton=e.button;
    lastX=e.clientX;
    lastY=e.clientY;

    canvas.setPointerCapture(e.pointerId);
    canvas.classList.add("dragging");
});

canvas.addEventListener("pointermove",e=>{
    if(!dragging || e.pointerId!==activePointer) return;

    const dx=e.clientX-lastX;
    const dy=e.clientY-lastY;

    lastX=e.clientX;
    lastY=e.clientY;

    if(dragButton===0) {
        orbit.targetTheta-=dx*0.006;
        orbit.targetPhi+=dy*0.006;

        orbit.targetPhi=THREE.MathUtils.clamp(
            orbit.targetPhi,
            0.15,
            Math.PI-0.15
        );
    } else {
        const sensitivity=orbit.radius*0.0014;

        const right=new THREE.Vector3(
            Math.cos(orbit.theta),
            0,
            -Math.sin(orbit.theta)
        );

        orbit.target.addScaledVector(
            right,-dx*sensitivity
        );

        orbit.target.y+=dy*sensitivity;
    }
});

function stopDragging(e) {
    if(e.pointerId!==activePointer) return;

    dragging=false;
    activePointer=null;
    canvas.classList.remove("dragging");

    if(canvas.hasPointerCapture(e.pointerId)) {
        canvas.releasePointerCapture(e.pointerId);
    }
}

canvas.addEventListener("pointerup",stopDragging);
canvas.addEventListener("pointercancel",stopDragging);
canvas.addEventListener("contextmenu",e=>e.preventDefault());

canvas.addEventListener("wheel",e=>{
    e.preventDefault();

    const delta=THREE.MathUtils.clamp(
        e.deltaY,-200,200
    );

    orbit.targetRadius*=Math.exp(delta*0.0012);
    orbit.targetRadius=THREE.MathUtils.clamp(
        orbit.targetRadius,9,55
    );
},{passive:false});


// ========================================
// 4. 圣诞树粒子 Shader
// ========================================

const vertexShader = `
attribute float aSize;
attribute float aPhase;
attribute vec3 aColor;
attribute vec3 aScatter;

attribute float aRibbonT;
attribute float aRibbonSide;
attribute float aRibbonRandom;

uniform float uTime;
uniform float uForm;
uniform float uRibbon;
uniform float uRibbonSpeed;
uniform float uRibbonTurns;

varying vec3 vColor;
varying float vTwinkle;
varying float vFlow;
varying float vEdge;

const float PI2=6.28318530718;

vec3 getRibbonPosition(
    float t,
    float side,
    float randomValue
) {
    float angle =
        -t*PI2*uRibbonTurns+0.40;

    float radius =
        0.28+3.78*pow(1.0-t,0.94);

    float width =
        0.38+0.27*(1.0-t);

    float twist =
        t*PI2*1.35+0.35;

    float vertical =
        side*width*0.50*cos(twist);

    float radial =
        side*width*0.33*sin(twist);

    float tangential =
        side*width*0.20*cos(twist+0.6);

    float r=radius+radial;

    float x =
        cos(angle)*r-
        sin(angle)*tangential;

    float z =
        sin(angle)*r+
        cos(angle)*tangential;

    float y =
        -5.45+0.63+t*10.65+vertical;

    x+=(randomValue-0.5)*0.025;

    return vec3(x,y,z);
}

void main() {
    vec3 originalPosition=position;

    vFlow=1.0;
    vEdge=0.0;

    if(uRibbon>0.5) {
        float movingT=fract(
            aRibbonT+uTime*uRibbonSpeed
        );

        originalPosition=getRibbonPosition(
            movingT,
            aRibbonSide,
            aRibbonRandom
        );

        float wave=sin(
            movingT*55.0-
            uTime*5.5+
            aPhase*0.12
        );

        float glint=pow(
            max(0.0,wave),5.0
        );

        vFlow=0.82+0.35*glint;
        vEdge=abs(aRibbonSide);
    }

    vec3 pos=mix(
        aScatter,
        originalPosition,
        uForm
    );

    vColor=aColor;

    vTwinkle =
        0.82+
        0.18*sin(uTime*2.4+aPhase);

    vec4 mvPosition =
        modelViewMatrix*vec4(pos,1.0);

    gl_Position =
        projectionMatrix*mvPosition;

    gl_PointSize=clamp(
        aSize*38.0/
        max(1.0,-mvPosition.z),
        1.0,14.0
    );
}
`;

const fragmentShader = `
uniform float uBrightness;
uniform float uRibbon;

varying vec3 vColor;
varying float vTwinkle;
varying float vFlow;
varying float vEdge;

void main() {
    vec2 uv=gl_PointCoord-vec2(0.5);
    float d=length(uv);

    if(d>0.5) discard;

    float core=exp(-d*d*42.0);
    float halo=exp(-d*d*13.0);

    float alpha=
        (0.63*core+0.12*halo)*
        vTwinkle*uBrightness;

    if(uRibbon>0.5) {
        alpha*=vFlow;

        float edgeGlow=smoothstep(
            0.75,1.0,vEdge
        );

        alpha*=1.0+0.18*edgeGlow;
    }

    vec3 color=
        vColor*(0.80+0.20*core);

    gl_FragColor=vec4(
        color,
        clamp(alpha,0.0,1.0)
    );
}
`;

const materials=[];
const formableMaterials=[];

function makeParticles(
    data,
    brightness=1,
    isRibbon=false,
    canScatter=true
) {
    const n=data.length;

    const positions=new Float32Array(n*3);
    const scatter=new Float32Array(n*3);
    const colors=new Float32Array(n*3);
    const sizes=new Float32Array(n);
    const phases=new Float32Array(n);
    const ribbonT=new Float32Array(n);
    const ribbonSide=new Float32Array(n);
    const ribbonRandom=new Float32Array(n);

    for(let i=0;i<n;i++) {
        const p=data[i];
        const j=i*3;

        positions[j]=p.x;
        positions[j+1]=p.y;
        positions[j+2]=p.z;

        scatter[j]=random(-19,19);
        scatter[j+1]=random(-14,14);
        scatter[j+2]=random(-19,19);

        colors[j]=p.color.r;
        colors[j+1]=p.color.g;
        colors[j+2]=p.color.b;

        sizes[i]=p.size||2;
        phases[i]=Math.random()*TAU;

        ribbonT[i]=p.t??0;
        ribbonSide[i]=p.side??0;
        ribbonRandom[i]=p.randomValue??0;
    }

    const geometry=new THREE.BufferGeometry();

    const attrs={
        position:[positions,3],
        aScatter:[scatter,3],
        aColor:[colors,3],
        aSize:[sizes,1],
        aPhase:[phases,1],
        aRibbonT:[ribbonT,1],
        aRibbonSide:[ribbonSide,1],
        aRibbonRandom:[ribbonRandom,1]
    };

    for(const [name,[array,size]] of Object.entries(attrs)) {
        geometry.setAttribute(
            name,
            new THREE.BufferAttribute(array,size)
        );
    }

    const material=new THREE.ShaderMaterial({
        vertexShader,
        fragmentShader,
        uniforms:{
            uTime:{value:0},
            uForm:{value:1},
            uBrightness:{
                value:brightness*CONFIG.brightness
            },
            uRibbon:{value:isRibbon?1:0},
            uRibbonSpeed:{
                value:CONFIG.ribbonFlowSpeed
            },
            uRibbonTurns:{
                value:CONFIG.ribbonTurns
            }
        },
        transparent:true,
        depthWrite:false,
        depthTest:true,
        blending:THREE.NormalBlending
    });

    material.userData.baseBrightness=brightness;
    materials.push(material);

    if(canScatter) {
        formableMaterials.push(material);
    }

    const points=new THREE.Points(
        geometry,material
    );

    points.frustumCulled=false;
    return points;
}


// ========================================
// 5. 树叶颜色
// ========================================

const stops=[
    [0.00,new THREE.Color("#13ba79")],
    [0.22,new THREE.Color("#12d5ad")],
    [0.44,new THREE.Color("#23bcdf")],
    [0.65,new THREE.Color("#568ef4")],
    [0.83,new THREE.Color("#aa78ec")],
    [1.00,new THREE.Color("#f8b6ec")]
];

function treeColor(h) {
    h=THREE.MathUtils.clamp(h,0,1);

    for(let i=0;i<stops.length-1;i++) {
        const [a,ca]=stops[i];
        const [b,cb]=stops[i+1];

        if(h<=b) {
            return ca.clone().lerp(
                cb,(h-a)/(b-a)
            );
        }
    }

    return stops[stops.length-1][1].clone();
}


// ========================================
// 6. 立体树枝
// ========================================

function genBranches() {
    const pts=[];
    const layers=CONFIG.branchLayers;

    for(let layer=0;layer<layers;layer++) {
        const h=layer/(layers-1);

        const tierY=
            BASE_Y+0.35+h*CONFIG.treeHeight;

        const length=
            0.15+
            CONFIG.treeRadius*Math.pow(1-h,0.94);

        const branchCount=Math.round(14-h*5);
        const droop=0.36*(1-h)+0.06;

        for(let b=0;b<branchCount;b++) {
            const angle=
                b/branchCount*TAU+layer*0.31;

            const cos=Math.cos(angle);
            const sin=Math.sin(angle);
            const tx=-sin;
            const tz=cos;

            const branchY=s=>tierY-droop*s*s;

            // 主枝
            for(let k=0;k<38;k++) {
                const s=k/37;
                const r=0.12+length*s;

                const color=treeColor(h).lerp(
                    new THREE.Color("#c5fff1"),0.13
                );

                pts.push({
                    x:cos*r,
                    y:branchY(s),
                    z:sin*r,
                    color,
                    size:random(1.8,3.0)
                });
            }

            // 左右分叉
            for(let j=0;j<9;j++) {
                const s0=0.16+j/8*0.73;
                const twigLength=
                    (0.17+0.38*(1-s0))*
                    (1-0.35*h);

                for(const side of [-1,1]) {
                    for(let k=0;k<13;k++) {
                        const q=k/12;

                        const r=
                            0.12+length*(s0+q*0.075);

                        const lateral=
                            side*twigLength*q;

                        const color=treeColor(h).lerp(
                            new THREE.Color("#e6fff8"),
                            0.20+0.12*q
                        );

                        pts.push({
                            x:cos*r+tx*lateral,
                            y:branchY(s0)+
                                0.065*q+random(-.02,.02),
                            z:sin*r+tz*lateral,
                            color,
                            size:random(1.6,2.8)
                        });
                    }
                }
            }

            // 针叶
            for(let i=0;i<CONFIG.needlesPerBranch;i++) {
                const s=random(0.08,1);
                const r=0.12+length*s;

                const width=
                    (0.12+0.34*Math.sin(Math.PI*s))*
                    (1-0.38*h);

                const lateral=random(-width,width);

                let color=treeColor(h);

                if(Math.random()<0.16) {
                    color.lerp(
                        new THREE.Color("#d5fff7"),0.30
                    );
                }

                pts.push({
                    x:cos*r+tx*lateral,
                    y:branchY(s)+random(-.105,.105),
                    z:sin*r+tz*lateral,
                    color,
                    size:random(1,2.7)
                });
            }

            pts.push({
                x:cos*(length+0.12),
                y:branchY(1),
                z:sin*(length+0.12),
                color:treeColor(h).lerp(
                    new THREE.Color("#ffffff"),.45
                ),
                size:3.4
            });
        }
    }

    // 树冠内部填充
    for(let i=0;i<CONFIG.innerFillPoints;i++) {
        const layer=Math.floor(random(0,layers));
        const h=layer/(layers-1);

        const tierY=
            BASE_Y+0.35+h*CONFIG.treeHeight;

        const outer=
            CONFIG.treeRadius*Math.pow(1-h,.94);

        const r=outer*Math.sqrt(Math.random())*.85;
        const a=Math.random()*TAU;

        pts.push({
            x:Math.cos(a)*r,
            y:tierY+random(-.125,.125),
            z:Math.sin(a)*r,
            color:treeColor(h),
            size:random(1,2.3)
        });
    }

    return pts;
}


// ========================================
// 7. 流动丝带
// ========================================

function genRibbonParticles() {
    const pts=[];

    const pink=new THREE.Color("#f6b5d8");
    const gold=new THREE.Color("#f4d4aa");
    const white=new THREE.Color("#fff4e8");

    for(let i=0;i<CONFIG.ribbonPoints;i++) {
        const t=Math.random();

        let side=random(-1,1);
        const edge=Math.random()<0.24;

        if(edge) {
            side=(Math.random()<.5?-1:1)*
                 random(.87,1);
        }

        const color=edge
            ? white.clone().lerp(gold,random(0,.35))
            : pink.clone().lerp(gold,random(.25,.8));

        pts.push({
            x:0,y:0,z:0,
            t,side,
            randomValue:Math.random(),
            color,
            size:edge?random(2.4,4.4):
                      random(1.5,3.3)
        });
    }

    return pts;
}


// ========================================
// 8. 挂饰和爱心
// ========================================

function genOrnaments() {
    const pts=[];
    const palette=[
        "#ffdf9b","#ffe9c4",
        "#ffbcd8","#b3e8ff","#d8c3ff"
    ];

    for(let i=0;i<CONFIG.ornamentPoints;i++) {
        const h=random(.05,.92);

        const r=CONFIG.treeRadius*
            Math.pow(1-h,.94)*random(.75,1);

        const a=Math.random()*TAU;

        pts.push({
            x:Math.cos(a)*r,
            y:BASE_Y+.35+h*CONFIG.treeHeight,
            z:Math.sin(a)*r,
            color:new THREE.Color(
                palette[Math.floor(random(0,palette.length))]
            ),
            size:random(3,5)
        });
    }

    return pts;
}

function genHeart() {
    const pts=[];

    while(pts.length<CONFIG.heartPoints) {
        const x=random(-1.25,1.25);
        const y=random(-1.35,1.35);

        const f=
            Math.pow(x*x+y*y-1,3)-
            x*x*Math.pow(y,3);

        if(f<=0) {
            pts.push({
                x:x*.53,
                y:6.5+(y+.2)*.55,
                z:random(-.14,.14),
                color:new THREE.Color(
                    Math.random()<.22
                    ? "#fff1fa"
                    : "#f6a0dc"
                ),
                size:random(2,4)
            });
        }
    }

    return pts;
}


// ========================================
// 9. 地面光环：稍微变亮
// ========================================

function genGround() {
    const pts=[];

    const rings=[
        4.4,5.5,6.8,8.2,9.8
    ];

    for(let i=0;i<CONFIG.groundPoints;i++) {
        const ring=
            rings[Math.floor(Math.random()*rings.length)];

        const r=ring+random(-.225,.225);
        const a=Math.random()*TAU;

        // 增加部分淡白色星光
        const pick=Math.random();

        let color;

        if(pick<0.18) {
            color=new THREE.Color("#e3ddff");
        } else if(pick<0.48) {
            color=new THREE.Color("#a2b8ff");
        } else {
            color=new THREE.Color("#6e91ef");
        }

        pts.push({
            x:Math.cos(a)*r,
            y:BASE_Y-.26,
            z:Math.sin(a)*r,
            color,
            size:random(1.2,2.6)
        });
    }

    return pts;
}


// ========================================
// 10. 背景星光和远景雪点
// ========================================

function genStars() {
    const pts=[];

    for(let i=0;i<CONFIG.starPoints;i++) {
        const white=Math.random()<.72;

        pts.push({
            x:random(-45,45),
            y:random(-27.5,27.5),
            z:random(-60,-18),
            color:new THREE.Color(
                white?"#ffffff":"#c8d7ff"
            ),
            size:white?random(.9,2.1):
                       random(1.2,2.7)
        });
    }

    return pts;
}

function genTinySnow() {
    const pts=[];

    for(let i=0;i<CONFIG.tinySnowPoints;i++) {
        pts.push({
            x:random(-46,46),
            y:random(-29,29),
            z:random(-55,-10),
            color:new THREE.Color(
                Math.random()<.85
                ? "#ffffff":"#dbe6ff"
            ),
            size:random(.6,1.4)
        });
    }

    return pts;
}


// ========================================
// 11. 组装圣诞树
// ========================================

const treeGroup=new THREE.Group();

treeGroup.position.x=2.1;
treeGroup.scale.setScalar(CONFIG.treeScale);

scene.add(treeGroup);

const branches=makeParticles(
    genBranches(),.98
);

const ribbon=makeParticles(
    genRibbonParticles(),1.12,true
);

const ornaments=makeParticles(
    genOrnaments(),1.12
);

const heart=makeParticles(
    genHeart(),1.06
);

// 原来为 0.42，稍微提高亮度
const ground=makeParticles(
    genGround(),.56
);

const stars=makeParticles(
    genStars(),.72,false,false
);

const tinySnow=makeParticles(
    genTinySnow(),.58,false,false
);

treeGroup.add(branches);
treeGroup.add(ribbon);
treeGroup.add(ornaments);
treeGroup.add(heart);
treeGroup.add(ground);

scene.add(stars);
scene.add(tinySnow);


// ========================================
// 12. 动态飘雪
// ========================================

const snowPos=new Float32Array(
    CONFIG.snowPoints*3
);

const snowSpeed=[];

for(let i=0;i<CONFIG.snowPoints;i++) {
    const j=i*3;

    snowPos[j]=random(-17,17);
    snowPos[j+1]=random(-7,18);
    snowPos[j+2]=random(5,15);

    snowSpeed.push(random(.4,1.3));
}

const snowGeo=new THREE.BufferGeometry();

snowGeo.setAttribute(
    "position",
    new THREE.BufferAttribute(snowPos,3)
);

const snow=new THREE.Points(
    snowGeo,
    new THREE.PointsMaterial({
        color:0xf4f7ff,
        size:.05,
        transparent:true,
        opacity:.72,
        depthWrite:false
    })
);

scene.add(snow);

function updateSnow(dt) {
    for(let i=0;i<CONFIG.snowPoints;i++) {
        const j=i*3;

        snowPos[j+1]-=snowSpeed[i]*dt;
        snowPos[j]+=Math.sin(elapsed+i)*dt*.09;

        if(snowPos[j+1]<-8) {
            snowPos[j+1]=18;
            snowPos[j]=random(-17,17);
        }
    }

    snowGeo.attributes.position.needsUpdate=true;
}


// ========================================
// 13. 新增流星系统
// ========================================

// 将流星放在相机后方的远景平面上。
// 流星运动始终覆盖整个浏览器视口，
// 不会因为旋转相机而消失。

scene.add(camera);

const meteorLayer=new THREE.Group();
meteorLayer.position.z=-105;

camera.add(meteorLayer);

function resizeMeteorLayer() {
    const distance=105;

    const viewHeight=
        2*Math.tan(
            THREE.MathUtils.degToRad(camera.fov)/2
        )*distance;

    const viewWidth=
        viewHeight*camera.aspect;

    // 使用 -1 到 1 的标准化屏幕坐标
    meteorLayer.scale.set(
        viewWidth/2,
        viewHeight/2,
        1
    );
}

resizeMeteorLayer();


// 流星尾迹 Shader：由尾部向头部逐渐变亮

const meteorVertexShader=`
attribute float aFade;
varying float vFade;

void main() {
    vFade=aFade;

    gl_Position=
        projectionMatrix*
        modelViewMatrix*
        vec4(position,1.0);
}
`;

const meteorFragmentShader=`
uniform vec3 uColor;
uniform float uOpacity;

varying float vFade;

void main() {
    gl_FragColor=vec4(
        uColor,
        vFade*uOpacity
    );
}
`;


// 创建流星光尾
function createMeteorTrail() {
    const positions=[];
    const fades=[];
    const indices=[];

    const segments=24;

    for(let i=0;i<=segments;i++) {
        const t=i/segments;

        // 头部位于 x=0，尾巴向负 x 延伸
        const x=(t-1)*.33;

        // 头部略宽，尾部逐渐收窄
        const width=
            .001+.0065*t*t;

        positions.push(
            x,-width,0,
            x,width,0
        );

        const alpha=Math.pow(t,2.6);

        fades.push(alpha,alpha);

        if(i<segments) {
            const j=i*2;

            indices.push(
                j,j+1,j+2,
                j+1,j+3,j+2
            );
        }
    }

    const geometry=new THREE.BufferGeometry();

    geometry.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(
            positions,3
        )
    );

    geometry.setAttribute(
        "aFade",
        new THREE.Float32BufferAttribute(
            fades,1
        )
    );

    geometry.setIndex(indices);

    return geometry;
}

const sharedMeteorGeometry=createMeteorTrail();


// 生成柔和流星头部纹理

function createMeteorHeadTexture() {
    const c=document.createElement("canvas");
    c.width=64;
    c.height=64;

    const ctx=c.getContext("2d");

    const gradient=ctx.createRadialGradient(
        32,32,0,
        32,32,32
    );

    gradient.addColorStop(0,"rgba(255,255,255,1)");
    gradient.addColorStop(.12,"rgba(255,255,255,.95)");
    gradient.addColorStop(.35,"rgba(225,235,255,.42)");
    gradient.addColorStop(1,"rgba(225,235,255,0)");

    ctx.fillStyle=gradient;
    ctx.fillRect(0,0,64,64);

    const texture=new THREE.CanvasTexture(c);
    texture.colorSpace=THREE.SRGBColorSpace;

    return texture;
}

const meteorHeadTexture=createMeteorHeadTexture();

const meteorColors=[
    "#ffffff",
    "#dcecff",
    "#fff0d8",
    "#e6d8ff"
];


// 创建一个可重复使用的流星对象

function createMeteor() {
    const material=new THREE.ShaderMaterial({
        vertexShader:meteorVertexShader,
        fragmentShader:meteorFragmentShader,

        uniforms:{
            uColor:{
                value:new THREE.Color("#ffffff")
            },
            uOpacity:{value:0}
        },

        transparent:true,
        blending:THREE.AdditiveBlending,
        depthWrite:false,
        depthTest:true,
        side:THREE.DoubleSide
    });

    const trail=new THREE.Mesh(
        sharedMeteorGeometry,
        material
    );

    const headMaterial=new THREE.SpriteMaterial({
        map:meteorHeadTexture,
        color:0xffffff,
        transparent:true,
        opacity:0,
        blending:THREE.AdditiveBlending,
        depthWrite:false,
        depthTest:true
    });

    const head=new THREE.Sprite(headMaterial);

    head.scale.set(.035,.060,1);

    const group=new THREE.Group();

    group.add(trail);
    group.add(head);

    meteorLayer.add(group);

    group.visible=false;

    return {
        group,
        material,
        head,
        active:false,
        age:0,
        duration:3,
        start:new THREE.Vector2(),
        end:new THREE.Vector2(),
        strength:1
    };
}


// 创建流星池，避免反复创建 WebGL 对象

const meteors=[];

for(let i=0;i<CONFIG.meteorCount;i++) {
    meteors.push(createMeteor());
}


// 发射流星：每次随机方向、随机路径、随机颜色

function launchMeteor(meteor) {

    const angle=Math.random()*TAU;

    const direction=new THREE.Vector2(
        Math.cos(angle),
        Math.sin(angle)
    );

    const perpendicular=new THREE.Vector2(
        -direction.y,
        direction.x
    );

    // 让路径在背景的不同区域穿过
    const offset=random(-.75,.75);

    const center=perpendicular.multiplyScalar(
        offset
    );

    // 从画面外出发，穿过整个画面后离开
    meteor.start.copy(center).addScaledVector(
        direction,-2.3
    );

    meteor.end.copy(center).addScaledVector(
        direction,2.3
    );

    meteor.duration=random(
        CONFIG.meteorDurationMin,
        CONFIG.meteorDurationMax
    );

    meteor.age=0;
    meteor.active=true;
    meteor.strength=random(.65,1);

    meteor.group.rotation.z=angle;

    meteor.group.scale.set(
        random(.75,1.25),
        random(.85,1.2),
        1
    );

    const color=new THREE.Color(
        meteorColors[
            Math.floor(Math.random()*meteorColors.length)
        ]
    );

    meteor.material.uniforms.uColor.value.copy(
        color
    );

    meteor.head.material.color.copy(color);

    meteor.group.visible=true;
}


// 平滑进入、消失

function smooth01(t) {
    t=THREE.MathUtils.clamp(t,0,1);
    return t*t*(3-2*t);
}


let meteorSpawnTimer=.5;

function updateMeteors(dt) {

    meteorSpawnTimer-=dt;

    if(meteorSpawnTimer<=0) {

        const available=meteors.find(
            meteor=>!meteor.active
        );

        if(available) {
            launchMeteor(available);
        }

        meteorSpawnTimer=random(
            CONFIG.meteorIntervalMin,
            CONFIG.meteorIntervalMax
        );
    }

    for(const meteor of meteors) {

        if(!meteor.active) continue;

        meteor.age+=dt;

        const t=meteor.age/meteor.duration;

        if(t>=1) {
            meteor.active=false;
            meteor.group.visible=false;
            continue;
        }

        // 流星沿直线路径前进
        const x=THREE.MathUtils.lerp(
            meteor.start.x,
            meteor.end.x,
            t
        );

        const y=THREE.MathUtils.lerp(
            meteor.start.y,
            meteor.end.y,
            t
        );

        meteor.group.position.set(x,y,0);

        // 开始和结束时渐隐
        const fadeIn=smooth01(t/.12);
        const fadeOut=1-smooth01(
            (t-.88)/.12
        );

        const opacity=
            fadeIn*fadeOut*meteor.strength;

        meteor.material.uniforms.uOpacity.value=
            opacity*.90;

        meteor.head.material.opacity=
            opacity*.85;
    }
}


// ========================================
// 14. 控制台
// ========================================

document.getElementById("scaleSlider")
.addEventListener("input",e=>{
    const value=Number(e.target.value);

    treeGroup.scale.setScalar(value);

    document.getElementById("scaleValue")
        .textContent=value.toFixed(2);
});

document.getElementById("brightSlider")
.addEventListener("input",e=>{
    const value=Number(e.target.value);

    for(const material of materials) {
        material.uniforms.uBrightness.value=
            material.userData.baseBrightness*value;
    }

    document.getElementById("brightValue")
        .textContent=value.toFixed(2);
});

document.getElementById("speedSlider")
.addEventListener("input",e=>{
    const value=Number(e.target.value);

    ribbon.material.uniforms.uRibbonSpeed.value=
        value;

    document.getElementById("speedValue")
        .textContent=value.toFixed(3);
});

document.getElementById("pause")
.addEventListener("click",e=>{
    paused=!paused;

    e.target.textContent=paused
        ?"继续动画":"暂停动画";
});

document.getElementById("scatter")
.addEventListener("click",e=>{
    formTarget=formTarget===1?0:1;

    e.target.textContent=formTarget===1
        ?"粒子散开":"重新聚集";
});

document.getElementById("reset")
.addEventListener("click",()=>{
    orbit.targetTheta=0;
    orbit.targetPhi=1.38;
    orbit.targetRadius=23.5;

    orbit.target.set(1.7,.45,0);

    orbit.theta=orbit.targetTheta;
    orbit.phi=orbit.targetPhi;
    orbit.radius=orbit.targetRadius;

    treeGroup.rotation.y=0;

    updateCamera(1);
});

document.getElementById("shot")
.addEventListener("click",()=>{
    renderer.render(scene,camera);

    const link=document.createElement("a");
    link.download="ChristmasTree_JuneYu.png";
    link.href=canvas.toDataURL("image/png");
    link.click();
});


// ========================================
// 15. 浏览器窗口变化
// ========================================

window.addEventListener("resize",()=>{
    camera.aspect=innerWidth/innerHeight;
    camera.updateProjectionMatrix();

    renderer.setSize(innerWidth,innerHeight);

    // 流星始终覆盖整个背景
    resizeMeteorLayer();
});


// ========================================
// 16. 主动画循环
// ========================================

const clock=new THREE.Clock();

function animate() {
    requestAnimationFrame(animate);

    const dt=Math.min(
        clock.getDelta(),.05
    );

    if(!paused) {
        elapsed+=dt;

        // 圣诞树自动旋转
        treeGroup.rotation.y+=
            CONFIG.rotationSpeed*dt;

        // 动态雪花
        updateSnow(dt);

        // 随机方向流星
        updateMeteors(dt);
    }

    // 聚集与散开
    const factor=1-Math.exp(-3.5*dt);

    formCurrent=THREE.MathUtils.lerp(
        formCurrent,
        formTarget,
        factor
    );

    // 更新粒子时间
    for(const material of materials) {
        material.uniforms.uTime.value=elapsed;
    }

    for(const material of formableMaterials) {
        material.uniforms.uForm.value=formCurrent;
    }

    updateCamera(dt);

    renderer.render(scene,camera);
}

animate();

</script>
</body>
